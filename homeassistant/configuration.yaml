# Enable required integrations
homeassistant:
  packages: !include_dir_named packages

# REST API Command for wand gestures
rest_command:
  wand_gesture:
    url: "http://localhost:8123/api/events/wand_gesture"
    headers:
      Authorization: !secret ha_token
      Content-Type: "application/json"

phue:
  host: !secret hue_bridge_ip
